<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Fuente del icono de la app (los mismos colores que el favicon de la web).
       Los PNG y los vectores de Android se generan con tools/generar-recursos.mjs -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#fondo)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="368" cy="368" r="88" stroke-width="64"/>
    <circle cx="656" cy="656" r="88" stroke-width="64"/>
    <line x1="700" y1="324" x2="324" y2="700" stroke-width="72"/>
  </g>
</svg>
