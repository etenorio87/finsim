<ScrollView>
  <StackLayout fsContenedorEnfocable class="pagina">
    <StackLayout class="intro intro-primary">
      <Label text="Simula tu financiación" class="titulo" accessibilityRole="header" textWrap="true"></Label>
      <Label text="Introduce las condiciones y descubre el coste real. El precio del dinero es la TAE, no la cuota." class="subtitulo" textWrap="true"></Label>
    </StackLayout>

    <fs-formulario-condiciones [formulario]="store.formulario" titulo="Condiciones de la financiación" letra="F" acento="primary"></fs-formulario-condiciones>

    <Button text="Simular financiación" (tap)="simular()" class="boton boton-principal"></Button>

    @if (store.resultado(); as resultado) {
      <fs-resultado-financiacion [resultado]="resultado" [condiciones]="store.condiciones()" acento="primary"></fs-resultado-financiacion>

      @if (store.amortizacionAbierta()) {
        @if (origen(); as o) {
          <fs-amortizacion-parcial [origen]="o" (cerrar)="store.cerrarAmortizacion()"></fs-amortizacion-parcial>
        }
      } @else {
        <Button text="💰 Simular amortización parcial" (tap)="store.abrirAmortizacion()" class="boton boton-accent"></Button>
      }
    }
  </StackLayout>
</ScrollView>
