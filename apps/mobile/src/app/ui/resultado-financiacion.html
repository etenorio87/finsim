@let r = resultado();
<StackLayout [class]="esGanadora() ? 'tarjeta borde-' + acento() : 'tarjeta'">
  @if (etiqueta(); as titulo) {
    <GridLayout columns="*, auto" class="cabecera-resultado">
      <Label col="0" [text]="titulo" class="titulo-tarjeta" accessibilityRole="header" textWrap="true"></Label>
      @if (esGanadora()) {
        <Label col="1" [text]="'✓ ' + textoDistintivo()" [class]="'insignia texto-' + acento() + ' fondo-' + acento()"></Label>
      }
    </GridLayout>
  }

  <!-- 1. TAE: lo que decide -->
  <StackLayout class="bloque-tae">
    <Label text="① TAE (precio real del dinero)" class="etiqueta-resultado"></Label>
    <Label [text]="(r.tae | porcentaje)" [class]="'tae ' + (esGanadora() ? 'texto-' + acento() : '')"></Label>
    <Label text="Este es el coste real. Compara siempre por TAE." [class]="'nota texto-' + acento() + ' fondo-' + acento()" textWrap="true"></Label>
  </StackLayout>

  <!-- 2. Cuota: restricción de presupuesto -->
  <StackLayout class="bloque-cuota">
    <Label text="② Cuota" class="etiqueta-resultado"></Label>
    <Label [text]="(r.cuota | moneda)" class="cuota"></Label>
    <Label [text]="'cada ' + periodo()" class="ayuda"></Label>
  </StackLayout>

  <!-- 3. Costes: informativos -->
  <GridLayout columns="*, 8, *" rows="auto, 8, auto" class="costes">
    <StackLayout row="0" col="0" class="coste">
      <Label text="Coste financiero" class="etiqueta-coste"></Label>
      <Label [text]="(r.costeFinanciero | moneda)" class="valor-coste"></Label>
    </StackLayout>
    <StackLayout row="0" col="2" class="coste">
      <Label text="Coste total" class="etiqueta-coste"></Label>
      <Label [text]="(r.costeTotal | moneda)" class="valor-coste"></Label>
    </StackLayout>
    <StackLayout row="2" col="0" class="coste">
      <Label text="TIN nominal" class="etiqueta-coste"></Label>
      <Label [text]="(r.tin | porcentaje)" class="valor-coste"></Label>
    </StackLayout>
    <StackLayout row="2" col="2" class="coste">
      <Label text="Saldo medio" class="etiqueta-coste"></Label>
      <Label [text]="(r.saldoMedio | moneda)" class="valor-coste"></Label>
    </StackLayout>
  </GridLayout>

  @if (r.cuadro; as cuadro) {
    <GridLayout columns="*, auto" (tap)="verCuadro()" class="boton-cuadro"
      [accessible]="true" accessibilityRole="button" [accessibilityLabel]="'Ver cuadro de amortización, ' + cuadro.length + ' cuotas'">
      <Label col="0" text="Ver cuadro de amortización" [class]="'texto-' + acento()"></Label>
      <Label col="1" [text]="cuadro.length + ' cuotas  ›'" class="ayuda"></Label>
    </GridLayout>

    <GridLayout columns="*, 8, *" class="exportar">
      <Button col="0" [text]="exportando() === 'excel' ? 'Generando…' : 'Excel'" (tap)="exportar('excel')"
        [isEnabled]="exportando() === null" class="boton boton-excel"></Button>
      <Button col="2" [text]="exportando() === 'pdf' ? 'Generando…' : 'PDF'" (tap)="exportar('pdf')"
        [isEnabled]="exportando() === null" class="boton boton-pdf"></Button>
    </GridLayout>
    @if (errorExportacion(); as mensaje) {
      <Label [text]="mensaje" class="error" textWrap="true"></Label>
    }
  }
</StackLayout>
